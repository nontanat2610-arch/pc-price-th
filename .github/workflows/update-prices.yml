name: Update GPU prices daily

on:
  schedule:
    - cron: "0 22 * * *"  # รอบหลัก — ทุกวัน 05:00 น. เวลาไทย (22:00 UTC วันก่อนหน้า)
    - cron: "0 4 * * *"   # รอบสำรอง — 11:00 น. เวลาไทย เผื่อ GitHub ข้ามรอบเช้า
  workflow_dispatch:        # กดรันเองได้จากหน้า Actions

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install beautifulsoup4 playwright
          playwright install --with-deps chromium

      - name: Run scraper (48 รุ่นหลัก · 3 ร้าน)
        run: python scraper/scraper.py

      - name: Crawl JIB catalog (ทั้งหมวด)
        run: python scraper/crawl_jib.py

      - name: Verify suspicious price moves against product pages
        run: python scraper/verify_prices.py

      - name: Build price movers (ราคาขึ้น/ลง รายวัน)
        run: python scraper/build_movers.py

      - name: Build SEO category pages
        run: python scraper/build_pages.py

      - name: Commit updated prices
        run: |
          git config user.name "price-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data/ sitemap.xml *.html p/
          git diff --staged --quiet || git commit -m "update prices $(date +%F)"
          git push
